steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/reimbly-ai-agent:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/reimbly-ai-agent:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/reimbly-ai-agent:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'PORT=8080'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/reimbly-ai-agent:$COMMIT_SHA'

# Substitutions for different environments
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'reimbly-ai-agent'
  _MEMORY: '2Gi'
  _CPU: '2'
  _MAX_INSTANCES: '10'

# Optional: Add environment-specific substitutions
# You can override these when triggering the build:
# gcloud builds submit --substitutions=_REGION=europe-west1,_MEMORY=4Gi . 